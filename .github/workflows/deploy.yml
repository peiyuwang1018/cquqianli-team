name: Deploy to OSS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up ossutil
        uses: yizhoumo/setup-ossutil@v2
        with:
          endpoint: oss-cn-beijing.aliyuncs.com
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Configure static website routing
        run: ossutil website --method put oss://qianli-team .github/oss-website.xml

      - name: Remove files not needed for the site
        run: rm -rf .git .github

      - name: Upload to OSS
        run: ossutil cp -rf ./ oss://qianli-team/
